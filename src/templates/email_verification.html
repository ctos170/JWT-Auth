<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eposta Doğrulama Talebi</title>
    <style>
      .card {
        display: flex;
        align-content: space-around;
        flex-direction: column;
      }
      body {
        padding: 2em;
        display: flex;
        justify-content: center;
      }

      html {
        height: 100vh;
        width: 100%;
      }

      .content p {
        font-size: 19px;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
      }

      .title {
        font-size: 34px;
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="title">Eposta Doğrulama Talebi</h1>
      <div class="content">
        <p>Merhaba, {{email}}</p>
        <p>
          Hesabınız için eposta doğrulama talebinde bulundunuz. Epostanızı
          doğrulamak için aşağıdaki butona tıklayabilirsiniz:
        </p>

        <div>
          <a href="{{link}}" class="btn">Epostamı Doğrula</a>
        </div>

        <div>
          <a href="{{link}}" class="btn">{{link}}</a>
        </div>

        <p>
          Bu bağlantı 15 dakika geçerlidir. Eğer bu talebi siz yapmadıysanız,
          lütfen bu e-postayı dikkate almayınız.
        </p>
      </div>
    </div>
  </body>
</html>
